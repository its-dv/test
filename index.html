<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Initialize theme on page load -->
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <title>Simple Notepad</title>
</head>

<body>
  <header>
    <h1>Simple Notepad</h1>
  </header>

  <main>
    <div class="noteTitleRow">
      <h2 id="noteTitle" data-i18n="untitledNote" contenteditable="true">Untitled</h2>
    </div>

    <div class="mainContainer">
      <aside class="sidebar">
        <ul id="notesList"></ul>
        <div class="trashWrapper">
          <button id="trashButton" class="trashButton" data-i18n="trashButton">Trash</button>
          <div id="trashPanel" class="trashPanel">
            <p data-i18n="underDevelopment">Under Development</p>
          </div>
        </div>
      </aside>

      <div class="composer">
        <textarea id="textArea" data-i18n-placeholder="textArea" contenteditable="true"></textarea>
        <button id="saveButton" data-i18n="saveButton">Create</button>
        <button id="deleteButton" data-i18n="deleteButton">Delete</button>
      </div>
    </div>

    <p id="characterCounter">Character count: ...</p>

    <button id="openSettingsButton" class="preferenceButton">
      <img class="fixedIcons" src="images/settings.svg" alt="Settings">
    </button>

    <div id="settingsOverlay" class="settingsOverlay">
      <div id="panel" class="panel">
        <button id="themeButton" class="preferenceButton">
          <img id="themeIcon" class="fixedIcons" src="images/moon.svg" alt="Switch Theme">
        </button>
      </div>

      <div>
        <button id="translateButton" class="preferenceButton">
          <img class="fixedIcons" src="images/translate.svg" alt="Translate">
        </button>

        <fieldset id="translateDropdown" class="translateDropdown">
          <legend id="languages" data-i18n="languages">Languages</legend>
          <div>
            <input id="english" type="radio" name="language" value="en" checked>
            <label for="english">English</label>
          </div>
          <div>
            <input id="german" type="radio" name="language" value="de">
            <label for="german">Deutsch</label>
          </div>
          <div>
            <input id="french" type="radio" name="language" value="fr">
            <label for="french">Français</label>
          </div>
          <div>
            <input id="russian" type="radio" name="language" value="ru">
            <label for="russian">Русский</label>
          </div>
        </fieldset>
      </div>

      <button id="characterCountButton" class="preferenceButton">
        <img class="fixedIcons" src="images/hash.svg" alt="Character counter">
      </button>
    </div>

    <div id="toast" class="toast">Message</div>

  </main>

  <footer>
    <p id="rights" data-i18n="rights">&copy; 2026 Simple Notepad. All rights not reserved.</p>
  </footer>
</body>

</html>
